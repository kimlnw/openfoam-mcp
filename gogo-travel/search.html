<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search trips — GOGO!</title>
  <meta name="description" content="Filter and compare GOGO! trips by price, type, duration and rating.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="search">
  <header id="site-header"></header>

  <main class="wrap">
    <div class="results-head">
      <div>
        <h1 id="results-title">All trips</h1>
        <p class="muted" id="results-sub" style="margin-top:5px"></p>
      </div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="filter-label" style="margin:0">Sort</span>
          <div class="seg-toggle" id="sortToggle"></div>
        </div>
        <div class="seg-toggle" id="viewToggle"></div>
      </div>
    </div>

    <div class="results-layout">
      <aside class="filters">
        <div class="filters__head">
          <h3>Filters</h3>
          <button class="filters__clear" id="clearFilters" type="button">Clear all</button>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
            <span class="filter-label" style="margin:0">Max price</span>
            <span id="priceVal" style="font-weight:800;font-size:.98rem"></span>
          </div>
          <input type="range" id="priceRange" min="500" max="3000" step="50" value="3000" aria-label="Maximum price per person">
          <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint);margin-top:8px"><span>$500</span><span>$3,000</span></div>
        </div>

        <hr class="divider">
        <div><span class="filter-label">Trip type</span><div class="chips" id="typeChips"></div></div>
        <hr class="divider">
        <div><span class="filter-label">Duration</span><div class="chips" id="durChips"></div></div>
        <hr class="divider">
        <div class="chips" id="ratingChip"></div>
      </aside>

      <div id="resultsArea"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/search.js"></script>
</body>
</html>
