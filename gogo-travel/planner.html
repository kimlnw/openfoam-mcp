<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget planner — GOGO!</title>
  <meta name="description" content="Set a budget and how many are travelling — GOGO! finds trips that fit and shows exactly where the money goes.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="planner">
  <header id="site-header"></header>

  <main class="wrap" style="padding-top:34px;padding-bottom:52px">
    <div style="margin-bottom:28px">
      <span class="eyebrow">Plan by budget</span>
      <h1 style="font-size:2rem;margin-top:10px">Build a trip that fits your budget</h1>
    </div>

    <div class="planner-layout">
      <!-- INPUTS -->
      <div class="card" style="padding:24px">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <span class="filter-label" style="margin:0">Total budget</span>
          <span style="font-weight:800;font-size:1.35rem;color:var(--red)" id="budgetVal"></span>
        </div>
        <input type="range" id="budgetRange" min="500" max="10000" step="100" value="3000" style="margin-top:14px" aria-label="Total budget">
        <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint);margin-top:8px"><span>$500</span><span id="perPerson"></span><span>$10,000</span></div>

        <hr class="divider">

        <div style="display:flex;align-items:center;justify-content:space-between">
          <div><span class="filter-label" style="margin:0;display:block">Travelers</span><span style="font-weight:700;font-size:1.02rem" id="pVal"></span></div>
          <div style="display:flex;align-items:center;gap:14px">
            <button class="step fx" type="button" id="pDec" aria-label="Fewer travelers"></button>
            <span style="font-weight:800;font-size:1.05rem;min-width:26px;text-align:center" id="pNum"></span>
            <button class="step fx" type="button" id="pInc" aria-label="More travelers"></button>
          </div>
        </div>

        <hr class="divider">

        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <span class="filter-label" style="margin:0">Trip length</span>
          <span style="font-weight:700;font-size:1rem" id="nightsVal"></span>
        </div>
        <input type="range" id="nightsRange" min="2" max="14" step="1" value="7" style="margin-top:14px" aria-label="Trip length in nights">
        <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint);margin-top:8px"><span>2 nights</span><span>14 nights</span></div>

        <hr class="divider">

        <span class="filter-label">Trip style</span>
        <div class="chips" id="styleChips"></div>
      </div>

      <!-- RESULTS -->
      <div id="planResults" style="display:flex;flex-direction:column;gap:18px"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/planner.js"></script>
</body>
</html>
